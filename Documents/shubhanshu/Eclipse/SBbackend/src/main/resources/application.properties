spring.application.name=SBbackend
spring.datasource.url=jdbc:h2:mem:MyH2
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

#run the data.sql/import.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=h2

#logs for Spring's SQL script execution, including import.sql
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG

#logs for Hibernate SQL script execution
logging.level.org.hibernate.SQL=DEBUG

#logs the actual values bound to SQL queries (instead of just ? placeholders).
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB